[project]
name = "context-service"
version = "0.1.0"
description = "Evidence-backed engineering Context Service (agentic ETL + Neo4j GraphRAG + MCP/REST)"
requires-python = ">=3.12"
dependencies = [
  "litellm>=1.60",
  "pydantic>=2.8",
  "neo4j>=5.26",
  "networkx>=3.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.9",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
